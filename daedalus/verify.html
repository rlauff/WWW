<!doctype html><meta charset="utf-8"><title>daedalus · verify</title>
<style>
 body{background:#0e1013;color:#e6e9ee;font:13px/1.6 ui-monospace,Menlo,monospace;padding:24px;max-width:900px}
 h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7d8794}
 .ok{color:#5ac489}.bad{color:#ff7a59}.dim{color:#7d8794}
 pre{white-space:pre-wrap}
</style>
<h1>daedalus · browser engine verification</h1>
<p class="dim">Checks that the engine in this page agrees with the one it was built
from, and that the card computes the same network the reference does. Everything
below runs here, in this browser.</p>
<pre id="out">starting…</pre>
<script src="net.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const box = document.getElementById("out");
  const lines = [];
  let bad = 0;
  const say = () => { box.innerHTML = lines.join("\n"); };
  const line = t => { lines.push(t); say(); };
  const lines_pop = () => { lines.pop(); };
  const check = (what, got, want, tol) => {
    const ok = typeof want === "number" ? Math.abs(got - want) <= (tol || 0) : got === want;
    if (!ok) bad++;
    line(`  ${ok ? '<span class="ok">ok  </span>' : '<span class="bad">FAIL</span>'}  `
         + what + ": " + got + (ok ? "" : "  (wanted " + want + ")"));
    return ok;
  };

  try {
    await (window.DAEDALUS_BOOT || Promise.resolve());
    const w = window.DAEDALUS_WASM, N = window.DAEDALUS_NET;
    if (!w) { line('<span class="bad">the wasm engine did not start: '
                   + window.DAEDALUS_ERROR + "</span>"); return; }

    line("1. the search, with no network involved");
    for (const c of ["set threads 1","set batch 4","set sims 4000","set time_ms 600000",
                     "set temperature 0","set temp_plies 0","set arena 400000"]) w.cmd(c);
    w.cmd("set threads 1"); w.cmd("set batch 4");
    w.cmd("moves 4 76 13 67 22 58");
    let t = performance.now();
    const r = w.cmd("hint");
    check("move", r.label, "U");
    check("simulations", r.simulations, 3167);
    check("nodes", r.nodes, 399946);
    check("value", r.value, 0.1657, 1e-4);
    line('  <span class="dim">(' + (performance.now() - t).toFixed(0)
         + " ms — this is the native engine's exact result)</span>");

    line("");
    line("2. WebGPU");
    if (!navigator.gpu) {
      line('  <span class="bad">this browser has no WebGPU.</span> The page still works,');
      line('  <span class="dim">but the network runs on the cpu at seconds a position.</span>');
    } else {
      const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
      if (!adapter) line('  <span class="bad">no adapter — the card may be blocked</span>');
      else {
        const info = adapter.info || {};
        line('  <span class="ok">ok  </span>  adapter: ' + (info.vendor || "?")
             + " " + (info.architecture || "") + " " + (info.description || ""));
      }
    }

    line("");
    line("3. the weight file");
    t = performance.now();
    const net = await w.loadNetwork((seen, total) => {
      lines[lines.length - 1] = '  <span class="dim">fetching… '
        + (seen / 1e6).toFixed(0) + (total ? " of " + (total / 1e6).toFixed(0) : "") + " MB</span>";
      say();
    });
    line("  " + w.netStatus());
    check("shape", net.net.channels + "x" + net.net.blocks, "256x20");
    check("backend", net.backend, net.backend);
    line('  <span class="dim">(' + ((performance.now() - t) / 1000).toFixed(1) + " s)</span>");

    line("");
    line("4. the card against the reference");
    w.cmd("moves 4 76 13 67 22 58");
    w.beginSearch(1);
    const planes = w.searchPlanes();
    const mk = n => ({ logits: new Float32Array(n * net.net.actions),
                       values: new Float32Array(n), margins: new Float32Array(n),
                       sigmas: new Float32Array(n) });
    const got = mk(1);
    t = performance.now();
    await net.forward(1, planes, got);
    const gpuMs = performance.now() - t;
    // These are what the native engine says about this position with the
    // network that ships beside this page. They move when the network is
    // replaced, so they are here to confirm the right file was uploaded, not
    // to say anything about the arithmetic -- that is the comparison below.
    check("value  (champ.daed as shipped)", got.values[0], 0.4870, 2e-3);
    check("margin (champ.daed as shipped)", got.margins[0], 4.601, 2e-2);
    check("sigma  (champ.daed as shipped)", got.sigmas[0], 7.033, 2e-2);
    line('  <span class="dim">(' + gpuMs.toFixed(1) + " ms a position on "
         + net.backend + ")</span>");

    if (net.backend === "webgpu") {
      // THE CHECK THAT MATTERS. A shader that is subtly wrong still returns
      // numbers, and the engine still plays -- badly, in ways nobody watching
      // could place. So the card is compared against the reference on several
      // positions, not one: a bug in the residual chain shows up on a position
      // with pieces and walls long before it shows up on an empty board.
      const lines = [[], ["e2","e8","e3","e7","e4","e6"],
                     ["e2","e8","e3","e7","e4","e6","d4h","f6h","c3","g7"]];
      let worstValue = 0, worstMargin = 0, worstLogit = 0, at = "";
      for (let i = 0; i < lines.length; i++) {
        line('  <span class="dim">comparing position ' + (i + 1) + " of " + lines.length
             + " against the cpu reference (slow)…</span>");
        await new Promise(r => setTimeout(r, 20));
        w.cmd("newgame");
        for (const mv of lines[i]) w.cmd("play " + mv);
        w.beginSearch(1);
        const p = w.searchPlanes();
        const got = mk(1), want = mk(1);
        await net.forward(1, p, got);
        new N.CpuNet(net.net).forward(1, p, want);
        let logit = 0;
        for (let k = 0; k < net.net.actions; k++) {
          logit = Math.max(logit, Math.abs(got.logits[k] - want.logits[k]));
        }
        const dv = Math.abs(got.values[0] - want.values[0]);
        const dm = Math.abs(got.margins[0] - want.margins[0]);
        if (dv > worstValue) { worstValue = dv; at = "position " + (i + 1); }
        worstMargin = Math.max(worstMargin, dm);
        worstLogit = Math.max(worstLogit, logit);
        lines_pop();
        line("  position " + (i + 1) + " (" + (lines[i].length || "empty board")
             + (lines[i].length ? " plies" : "") + "): card " + got.values[0].toFixed(4)
             + " vs reference " + want.values[0].toFixed(4)
             + '  <span class="dim">(margin ' + got.margins[0].toFixed(2) + " vs "
             + want.margins[0].toFixed(2) + ")</span>");
      }
      line("");
      check("worst value difference", worstValue.toFixed(5), worstValue.toFixed(5));
      check("worst margin difference", worstMargin.toFixed(4), worstMargin.toFixed(4));
      check("worst policy difference", worstLogit.toFixed(4), worstLogit.toFixed(4));
      // f32 on a card against f32 in JavaScript: the orders of accumulation
      // differ, so a few thousandths is expected and anything more is not.
      if (worstValue > 5e-3 || worstLogit > 5e-2) {
        bad++;
        const msg = "  THE SHADERS DISAGREE WITH THE REFERENCE"
                  + (at ? " (worst at " + at + ")" : "")
                  + ". The card is not computing this network, and every move the"
                  + " engine makes is meaningless.";
        line('<span class="bad">' + msg + "</span>");
      } else {
        line('  <span class="ok">ok  </span>  the card and the reference agree'
             + ' &mdash; the shaders are right');
      }
    }

    line("");
    line("5. a whole move, the page driving the search");
    w.cmd("set sims 200"); w.cmd("set batch 8");
    w.cmd("moves 4 76 13 67 22 58");
    t = performance.now();
    const move = await w.searchMove(false, 0, null);
    const ms = performance.now() - t;
    check("a move came back", !!move.label, true);
    line("  " + move.label + " after " + move.simulations + " simulations in "
         + (ms / 1000).toFixed(1) + " s"
         + '  <span class="dim">(' + (move.simulations / (ms / 1000)).toFixed(0)
         + " sims a second)</span>");

    line("");
    line(bad ? '<span class="bad">' + bad + " check(s) failed</span>"
             : '<span class="ok">everything agrees with the native engine</span>');
  } catch (e) {
    line('<span class="bad">ERROR: ' + (e && e.stack || e) + "</span>");
  }
})();
</script>
